name: Validate permanent hardware links
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Preserve published identities and verify generated site
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE_COMMIT" ] && [ "$BASE_COMMIT" != "0000000000000000000000000000000000000000" ]; then
            git show "$BASE_COMMIT:registry.json" > /tmp/previous-registry.json
            python generate.py --check --against /tmp/previous-registry.json
          else
            python generate.py --check
          fi
      - run: python -m unittest discover -s tests -v
